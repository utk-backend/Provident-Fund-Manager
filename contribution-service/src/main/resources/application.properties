spring.application.name=contribution-service

# ─── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pfmanager}
spring.datasource.username=${DB_USERNAME:pfmanager}
spring.datasource.password=${DB_PASSWORD:pfmanager@123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Liquibase ─────────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ─── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Contribution Service Config ───────────────────────────────────────────────
# Whether to allow future-dated effective dates (false = reject future dates)
pfmanager.contributions.allow-future-dates=false
# Maximum allowed contribution amount
pfmanager.contributions.max-amount=9999999999999999.99
# Max length for the reference field
pfmanager.contributions.reference-max-length=100
# Max length for the note field
pfmanager.contributions.note-max-length=500
